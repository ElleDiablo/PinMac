name: Release

# Runs when a version tag is pushed, or by hand from the Actions tab
# ("Run workflow") to publish the release for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The newest changelog and the list of tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The code being released, built on its own
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: source

      - name: Build app and DMG
        working-directory: source
        run: scripts/build.sh "$TAG"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          # The release date from the "## [x.y.z] - YYYY-MM-DD" heading
          released=$(grep -m1 "^## \[$version\]" CHANGELOG.md | sed -nE 's/.* - ([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p')
          {
            if [ -n "$released" ]; then
              echo "_Released $(date -j -f %Y-%m-%d "$released" "+%B %-d, %Y")._"
            fi
            # The section for this version: from its heading to the next heading or link list.
            awk -v version="$version" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && /^(## )?\[/ { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || echo "See CHANGELOG.md for details." > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the newest version is marked "Latest".
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$TAG" = "$newest" ]; then latest=true; else latest=false; fi
          gh release create "$TAG" source/build/PinMac-*.dmg --title "PinMac ${TAG#v}" \
            --notes-file release-notes.md --latest="$latest"
