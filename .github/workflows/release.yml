name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Release notes from CHANGELOG.md
        run: |
          # The section for this version: from its "## [x.y.z]" heading to the next one.
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^(## )?\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md for details." > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/PinMac-*.dmg --title "PinMac ${GITHUB_REF_NAME#v}" --notes-file notes.md
